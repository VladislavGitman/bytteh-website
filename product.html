<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Информация о модели бытовой техники BYTTEHMD: характеристики, цена и наличие.">
  <title>Товар | BYTTEHMD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="./css2" rel="stylesheet">
  <style>
    :root{--bg:#f7f7f5;--white:#fff;--text:#111;--muted:#606060;--line:#e9e9e7;--accent:#44445b;--soft:#edf0ff;--shadow:0 18px 48px #14141414}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    .container{width:min(1120px,calc(100% - 32px));margin:auto}
    .topbar{position:sticky;top:0;z-index:5;background:#f7f7f5e6;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:12px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#282828}
    .brand-mark img{width:100%;height:100%;object-fit:contain}
    .nav-links{display:flex;align-items:center;gap:24px;color:var(--muted)}
    .nav-links a:hover,.breadcrumb a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
    main{padding:32px 0 64px}
    .breadcrumb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;color:var(--muted);font-size:.9rem}
    .breadcrumb span[aria-hidden="true"]{color:#aaa}
    .product-detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.9fr);gap:clamp(28px,6vw,72px);align-items:start;padding:clamp(20px,4vw,48px);border:1px solid var(--line);border-radius:28px;background:var(--white);box-shadow:var(--shadow)}
    .product-image{min-height:360px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#f6f6f4,#ecebe8)}
    .product-image img{display:block;width:100%;height:100%;max-height:560px;object-fit:contain}
    .product-image-placeholder{padding:32px;color:var(--muted);text-align:center}
    .tag{display:inline-flex;padding:7px 12px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{margin:16px 0;font-size:clamp(2rem,5vw,3.5rem);line-height:1.02;letter-spacing:-.06em}
    .product-description{margin:0;color:var(--muted);font-size:1.08rem}
    .product-meta{display:grid;gap:12px;margin:28px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .product-meta-row{display:flex;justify-content:space-between;gap:16px}
    .product-meta-label{color:var(--muted)}
    .product-meta-value{font-weight:700;text-align:right}
    .product-price{font-size:1.35rem}
    .product-stock-unavailable{color:#8a3c3c}
    .actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .button{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;border:1px solid transparent;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;transition:transform .2s,background .2s}
    .button:hover{background:#35354a;transform:translateY(-1px)}
    .back-link{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
    .page-status{margin:32px 0;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--white);color:var(--muted)}
    .page-status a{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
    .page-status[hidden],.product-detail[hidden],.product-image img[hidden],.product-image-placeholder[hidden]{display:none}
    footer{padding:24px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
    .footer-inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
    @media(max-width:760px){.nav{min-height:66px}.nav-links{gap:14px;font-size:.88rem}.product-detail{grid-template-columns:1fr}.product-image{min-height:260px}.product-meta-row{align-items:flex-start}}
    @media(max-width:420px){.brand-mark{width:34px;height:34px}.nav{gap:10px}.nav-links{gap:10px}.product-image{min-height:220px}.actions{align-items:stretch;flex-direction:column}.actions>*{width:100%}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="./index.html#top" aria-label="BYTTEHMD — на главную">
        <span class="brand-mark"><img src="./assets/logo-bytteh.png" alt=""></span>
        <span>BYTTEHMD</span>
      </a>
      <nav class="nav-links" aria-label="Основная навигация">
        <a href="./index.html#catalog">Каталог</a>
        <a href="./index.html#contacts">Контакты</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <nav class="breadcrumb" aria-label="Путь страницы">
      <a href="./index.html#top">Главная</a><span aria-hidden="true">/</span>
      <a href="./index.html#catalog">Каталог</a><span aria-hidden="true">/</span>
      <span id="breadcrumb-product">Товар</span>
    </nav>
    <p class="page-status" id="product-status" role="status" aria-live="polite">Загружаем товар…</p>
    <article class="product-detail" id="product-detail" hidden>
      <div class="product-image">
        <img id="product-image" alt="" hidden>
        <p class="product-image-placeholder" id="product-image-placeholder" hidden>Фото модели можно уточнить у консультанта.</p>
      </div>
      <div class="product-info">
        <span class="tag" id="product-category"></span>
        <h1 id="product-title"></h1>
        <p class="product-description" id="product-description"></p>
        <div class="product-meta">
          <div class="product-meta-row"><span class="product-meta-label">Бренд</span><span class="product-meta-value" id="product-brand"></span></div>
          <div class="product-meta-row"><span class="product-meta-label">Наличие</span><span class="product-meta-value" id="product-stock"></span></div>
          <div class="product-meta-row"><span class="product-meta-label">Цена</span><span class="product-meta-value product-price" id="product-price"></span></div>
        </div>
        <div class="actions">
          <a class="button" id="product-order" href="./index.html#contacts">Оставить заявку</a>
          <a class="back-link" href="./index.html#catalog">Вернуться в каталог</a>
        </div>
      </div>
    </article>
  </main>
  <footer><div class="container footer-inner"><span>© 2026 BYTTEHMD</span><a href="tel:+37379503566">+373 (79) 503-566</a></div></footer>
  <script type="module" src="./product-detail.js"></script>
</body>
</html>
